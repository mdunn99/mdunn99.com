{{ $pages := slice }}
{{ range .Site.RegularPages }}
  {{ $pages = $pages | append (dict "title" .Title "url" .RelPermalink "text" (.Plain | htmlUnescape) "tags" (.Params.tags | default slice)) }}
{{ end }}
{{ $index := resources.FromString "search-index.json" ($pages | jsonify) }}
<div id="searchbox" hidden>
  <form id="site-search" role="search" data-index="{{ $index.RelPermalink }}">
    <input type="text" id="search-query" placeholder="Search…" aria-label="Search this site" autocomplete="off">
    <button type="submit" aria-label="Search">
      <svg aria-hidden="true" height="1rem" viewBox="0 0 16 16" width="1rem"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path></svg>
    </button>
  </form>
</div>
<section id="search-results" aria-label="Search results" hidden>
  <p id="search-status" role="status" aria-live="polite"></p>
  <ul id="search-matches"></ul>
</section>
<script src="{{ "js/search.js" | relURL }}" defer></script>
