baseURL      = "https://mdunn99.com/"
title        = "Mike's Logs"
languageCode = "en-us"
theme        = "hugo-texify3"
enableRobotsTXT = true
rssLimit     = 10

[pagination]
  pagerSize = 10

[taxonomies]
  tag      = "tags"
  category = "categories"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # Posts use top-level "#" headings, so include h1 in the table of contents
  [markup.tableOfContents]
    startLevel = 1
    endLevel   = 4
    ordered    = false

[params]
  title       = "Mike's Logs"
  author      = "Michael Dunn"
  description = "Cybersecurity writeups, projects, and general thoughts by Michael Dunn"
  keywords    = ["cybersecurity", "pentest", "hackthebox", "writeup", "blog"]
  footnote    = """
<a class=link href=https://creativecommons.org/licenses/by-nc/4.0/ target=_blank rel=noopener>CC BY-NC 4.0</a> |
Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>
"""
  since       = "2025"
  dateFormat  = "Jan 2, 2006"
  customCSS   = []
  customJS    = []
  emphasisWithDots = true
  toc              = true
  showWordCount    = true
  showReadingTime  = true
  rootFontSize     = "100%"
  math             = false
  numberedSubtitles = false
  enableDuckDuckGoSearchBox = true

  # The theme ships with its author's giscus comments and Buy Me a Coffee
  # widget enabled; blank them out so they don't appear on this site.
  [params.commentEngine]
    code = ""
  [params.buymeacoffee]
    code = ""

  [params.sharingbuttons]
    facebook   = false
    twitter    = false
    email      = false
    linkedin   = false
    reddit     = false
    whatsapp   = false
    hackernews = false
    telegram   = false

[menu]
  [[menu.main]]
    identifier = "posts"
    name       = "Blog"
    url        = "/posts/"
    weight     = 1

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 2

  [[menu.main]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/mdunn99"
    weight     = 3
